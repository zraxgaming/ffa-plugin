name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build shaded jar
        run: mvn -B -DskipTests package

      - name: Find shaded jar
        id: jar
        shell: bash
        run: |
          jar_path="$(find target -maxdepth 1 -name '*-shaded.jar' | head -n 1)"
          if [ -z "$jar_path" ]; then
            jar_path="$(find target -maxdepth 1 -name '*.jar' ! -name 'original-*.jar' | head -n 1)"
          fi
          if [ -z "$jar_path" ]; then
            echo "No shaded jar found."
            exit 1
          fi
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$jar_path")" >> "$GITHUB_OUTPUT"

      - name: Create release bundle
        id: bundle
        shell: bash
        run: |
          safe_ref="$(printf '%s' "${GITHUB_REF_NAME:-${GITHUB_SHA::7}}" | tr '/\\ ' '---')"
          bundle_name="z-ffa-core-${safe_ref}.zip"
          mkdir -p dist/z-ffa-core
          cp "${{ steps.jar.outputs.path }}" "dist/z-ffa-core/${{ steps.jar.outputs.name }}"
          cp README.md CHANGELOG.md LICENSE dist/z-ffa-core/
          cp -R docs dist/z-ffa-core/docs
          (cd dist && zip -r "$bundle_name" z-ffa-core)
          echo "path=dist/$bundle_name" >> "$GITHUB_OUTPUT"
          echo "name=$bundle_name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: z-ffa-core-bundle
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.bundle.outputs.path }}
          generate_release_notes: true
