# xyz.zcraft.studios - Z-FFA Configuration
settings:
  prefix: "<dark_gray>[</dark_gray><aqua>Z-FFA</aqua><dark_gray>]</dark_gray> "
  default-spawn: "world, 0, 64, 0, 0, 0"
  database-type: "SQLITE" # SQLITE or MYSQL
  auto-update-configs: true
  update-check:
    enabled: true
    auto-download: true
    url: "https://api.github.com/repos/zraxgaming/ffa-plugin/releases/latest"
  cache-expire-minutes: 20
  autosave-minutes: 5
  lobby-items-enabled: true
  event:
    enabled: false
    arena: ""
    kit: ""
  unranked:
    enabled: true
  queue:
    ping-range:
      enabled: true
      max-difference: 80
      bypass-after-seconds: 30
  proxy:
    # standalone = this backend handles all queues locally.
    # backend = this backend can work with the bundled Velocity/Bungee coordinator.
    mode: "standalone"
    channel: "zffa:main"
    server-id: "ffa-1"
    report-capacity: true
    report-interval-seconds: 5
    route-queues: false
  player-menu:
    enabled: true
  # How often dynamic open menus refresh, in seconds.
  menu-refresh-seconds: 10
  match-countdown-seconds: 5
  match-timeout-minutes: 10
  elo-start: 0
  debug-enabled: false
  block-commands-in-match: true
  blocked-match-commands-bypass:
    - "/ffa leave"
    - "/duel leave"
    - "/msg"
    - "/r"
  protection:
    block-break: true
    block-place: true
    item-drop: true
    item-pickup: true
    prevent-outside-pvp: true
  ffa:
    death-messages:
      enabled: true
      broadcast: true
      actionbar: true
    require-mutual-hit: true
    fight-request-expire-seconds: 10
    kill-heal-hearts: 20.0
    refill-hunger-on-kill: true
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "zffa"
    username: "root"
    password: ""
    pool-size: 10

commands:
  menu:
    enabled: true
    show-in-help: true
    aliases: [main, gui]
  join:
    enabled: true
    show-in-help: true
    aliases: [queue, kits, play, ranked]
  unranked:
    enabled: true
    show-in-help: true
    aliases: []
  ffa:
    enabled: true
    show-in-help: true
    aliases: [arenas, browser]
  event:
    enabled: false
    show-in-help: false
    aliases: []
  viparena:
    enabled: false
    show-in-help: false
    aliases: [vip]
  arena:
    enabled: false
    show-in-help: false
    aliases: []
  ranks:
    enabled: true
    show-in-help: true
    aliases: [rank]
  party:
    enabled: true
    show-in-help: true
    aliases: []
  kit:
    enabled: true
    show-in-help: true
    aliases: []
  leave:
    enabled: true
    show-in-help: true
    aliases: [quit]
  stats:
    enabled: true
    show-in-help: true
    aliases: []
  streak:
    enabled: true
    show-in-help: true
    aliases: [streaks, winstreak]
  top:
    enabled: true
    show-in-help: true
    aliases: [leaderboard]
  items:
    enabled: true
    show-in-help: false
    aliases: []
  spawn:
    enabled: true
    show-in-help: true
    aliases: [lobby]
  status:
    enabled: true
    show-in-help: true
    aliases: []

ranks:
  - name: "Coal I"
    min-elo: 0
    material: COAL
  - name: "Coal II"
    min-elo: 500
    material: COAL
  - name: "Coal III"
    min-elo: 1000
    material: COAL
  - name: "Iron"
    min-elo: 1500
    material: IRON_INGOT
  - name: "Gold"
    min-elo: 2000
    material: GOLD_INGOT
  - name: "Diamond"
    min-elo: 2500
    material: DIAMOND
  - name: "Netherite"
    min-elo: 3000
    material: NETHERITE_INGOT

lobby-items:
  main-menu:
    slot: 4
    material: NETHER_STAR
    name: "<gradient:#21d4fd:#b721ff><bold>Z-FFA Menu</bold></gradient>"
    lore:
      - "<gray>Open queues, FFA arenas, stats, and party tools."
      - "<dark_gray>Status: <white>%status%</white>"
    action: OPEN_MAIN
  queue-selector:
    slot: 0
    material: DIAMOND_SWORD
    name: "<gradient:#21d4fd:#b721ff><bold>Ranked Queue</bold></gradient>"
    lore:
      - "<gray>Right-click to choose a kit queue."
      - "<dark_gray>Status: <white>%status%</white>"
    action: OPEN_KITS
  unranked-queue:
    slot: 1
    material: PAPER
    name: "<gradient:#a8ff78:#78ffd6><bold>Unranked Queue</bold></gradient>"
    lore:
      - "<gray>Right-click to choose an unranked kit queue."
      - "<dark_gray>Status: <white>%status%</white>"
    action: OPEN_UNRANKED_KITS
  stats:
    slot: 5
    material: PLAYER_HEAD
    name: "<gold>Your Stats</gold>"
    lore:
      - "<gray>Elo: <white>%elo%</white>"
      - "<gray>Rank: <white>%rank%</white>"
      - "<gray>Wins: <white>%wins%</white> <dark_gray>|</dark_gray> <gray>Losses: <white>%losses%</white>"
      - "<gray>Kills: <white>%kills%</white> <dark_gray>|</dark_gray> <gray>Deaths: <white>%deaths%</white>"
      - "<gray>Streak: <white>%streak%</white>"
    action: OPEN_STATS
  leaderboard:
    slot: 8
    material: EMERALD
    name: "<green>Leaderboard</green>"
    lore:
      - "<gray>View the top cached fighters."
    action: OPEN_LEADERBOARD
  party:
    slot: 3
    material: NAME_TAG
    name: "<gold>Party Hub</gold>"
    lore:
      - "<gray>Open party commands and party status."
    action: OPEN_PARTY
  ffa-arenas:
    slot: 6
    material: NETHERITE_SWORD
    name: "<gold><bold>FFA Arenas</bold></gold>"
    lore:
      - "<gray>Join an open FFA arena."
      - "<dark_gray>Status: <white>%status%</white>"
    action: OPEN_FFA_ARENAS
  event:
    slot: 7
    material: FIREWORK_ROCKET
    name: "<gradient:#f093fb:#f5576c>Event Queue</gradient>"
    lore:
      - "<gray>Join the configured event arena."
    action: OPEN_EVENT
