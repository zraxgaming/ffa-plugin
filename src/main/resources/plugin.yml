name: Z-FFA
main: xyz.zcraft.studios.zffa.ZFfaPlugin
version: 1.3.6
api-version: '1.21'
author: ZCraft Studios
website: https://studio.z-craft.xyz
description: Professional FFA and 1v1 duel core. Open source (CC-BY-NC-SA) - Attribution required for forks/modifications. https://github.com/zraxgaming/ffa-plugin
softdepend:
  - PlaceholderAPI
  - Multiverse-Core
  - Vault
  - LuckPerms
  - Essentials
  - PluginMetrics
commands:
  zffa:
    description: Z-FFA admin command.
    usage: /zffa
  ffa:
    description: Player FFA command.
    usage: /ffa
  ffamenu:
    description: Open the main Z-FFA menu.
    usage: /ffamenu
    aliases: [zmenu, ffagui]
  ffastats:
    description: Open your Z-FFA stats.
    usage: /ffastats
    aliases: [mystats]
  ffatop:
    description: Open the Z-FFA leaderboard.
    usage: /ffatop
    aliases: [ffaleaderboard, topffa]
  ffaranks:
    description: Open the Z-FFA ranks menu.
    usage: /ffaranks
    aliases: [rankmenu]
  ffaarenas:
    description: Open the FFA arenas browser.
    usage: /ffaarenas
    aliases: [arenas]
  duel:
    description: Player duel command.
    usage: /duel
  cosmetics:
    description: Open the cosmetics menu.
    usage: /ffacosmetics
  killeffects:
    description: Open the kill effects menu.
    usage: /killeffects
    aliases: [killeffect]
  armortrims:
    description: Open the armor trims menu.
    usage: /armortrims
    aliases: [armortrim]
  ranked:
    description: Open the ranked queue menu.
    usage: /ranked
  unranked:
    description: Open the unranked queue menu.
    usage: /unranked
  party:
    description: Party command.
    usage: /party
  leave:
    description: Leave your current match, FFA session, or queue.
    usage: /leave
  leavequeue:
    description: Leave your current queue.
    usage: /leavequeue
  leaveparty:
    description: Leave your current party.
    usage: /leaveparty
permissions:
  zf.admin:
    description: Access to Z-FFA admin commands.
    default: op
  zf.player:
    description: Access to Z-FFA player commands.
    default: true
  zf.kit.*:
    description: Access to every Z-FFA kit.
    default: op
  zf.viparena:
    description: Access to VIP FFA arenas.
    default: op
  zf.cosmetic.*:
    description: Access to every Z-FFA cosmetic.
    default: op
  zf.cosmetic.killeffect.*:
    description: Access to every kill effect cosmetic.
    default: op
  zf.cosmetic.armortrim.*:
    description: Access to every armor trim cosmetic.
    default: op
