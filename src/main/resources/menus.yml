# DeluxeMenus-inspired menu configuration.
# Supported placeholders: %player%, %elo%, %rank%, %wins%, %losses%, %status%, %kit%, %queue_size%
menus:
  kit-selector:
    title: "<gradient:#21d4fd:#b721ff>Ranked Queue Selector</gradient>"
    size: 27
    center-items: true
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    kit-item:
      name: "%kit_display%"
      lore:
        - "<gray>Queued: <white>%queue_size%</white>"
        - "<gray>Click to join this ranked queue."
      glow: false
  kit-selector-unranked:
    title: "<gradient:#a8ff78:#78ffd6>Unranked Queue Selector</gradient>"
    size: 27
    center-items: true
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    kit-item:
      name: "%kit_display%"
      lore:
        - "<gray>Queued: <white>%queue_size%</white>"
        - "<gray>Click to join this unranked queue."
      glow: false
  stats:
    title: "<aqua>Your Stats</aqua>"
    size: 27
    items:
      profile:
        slot: 13
        material: PLAYER_HEAD
        name: "<gold>%player%</gold>"
        lore:
          - "<gray>Elo: <white>%elo%</white>"
          - "<gray>Rank: <white>%rank%</white>"
          - "<gray>Wins: <white>%wins%</white>"
          - "<gray>Losses: <white>%losses%</white>"
          - "<gray>Kills: <white>%kills%</white>"
          - "<gray>Deaths: <white>%deaths%</white>"
  leaderboard:
    title: "<gold>Top Fighters</gold>"
    size: 27
    entry-item:
      material: EMERALD
      name: "<green>#%position% %player%</green>"
      lore:
        - "<gray>Elo: <white>%elo%</white>"
        - "<gray>Rank: <white>%rank%</white>"
        - "<gray>Wins: <white>%wins%</white>"
  cosmetics:
    title: "<gold>Cosmetics</gold>"
    size: 27
    filler:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
    items:
      kill-effects:
        slot: 11
        material: FIREWORK_STAR
        name: "<gold>Kill Effects</gold>"
        lore:
          - "<gray>Selected: <white>%selected_kill_effect%</white>"
          - "<gray>Click to choose a kill effect."
      armor-trims:
        slot: 15
        material: DIAMOND_CHESTPLATE
        name: "<aqua>Armor Trims</aqua>"
        lore:
          - "<gray>Selected: <white>%selected_armor_trim%</white>"
          - "<gray>Applies to any armor from your kit."
  kill-effects:
    title: "<gold>Kill Effects</gold>"
    size: 27
    center-items: true
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    cosmetic-item:
      name: "%cosmetic_display%"
      lore:
        - "%status%"
        - "<dark_gray>Permission: %permission%"
  armor-trims:
    title: "<aqua>Armor Trims</aqua>"
    size: 27
    center-items: true
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    cosmetic-item:
      name: "%cosmetic_display%"
      lore:
        - "%status%"
        - "<dark_gray>Permission: %permission%"
