# DeluxeMenus-inspired menu configuration.
# Supported placeholders: %player%, %elo%, %rank%, %wins%, %losses%, %status%, %kit%, %queue_size%, %online%, %queued%, %ffa_players%, %arenas%
menus:
  main:
    title: "<gradient:#21d4fd:#b721ff><bold>Z-FFA Hub</bold></gradient>"
    size: 27
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    items:
      ranked:
        slot: 10
        material: DIAMOND_SWORD
        name: "<aqua><bold>Ranked</bold></aqua>"
        lore:
          - "<gray>Competitive 1v1 queue."
          - "<gray>Choose from combat-only kits."
          - "<dark_gray>Queued: <white>%queued%</white>"
        action: OPEN_RANKED
      unranked:
        slot: 11
        material: IRON_SWORD
        name: "<green><bold>Unranked</bold></green>"
        lore:
          - "<gray>Casual fights with the same kits."
          - "<dark_gray>Status: <white>%status%</white>"
        action: OPEN_UNRANKED
      ffa:
        slot: 13
        material: NETHERITE_SWORD
        name: "<gold><bold>FFA Arenas</bold></gold>"
        lore:
          - "<gray>Jump into open combat arenas."
          - "<gray>No TNT, placing, or breaking."
          - "<dark_gray>Players in FFA: <white>%ffa_players%</white>"
        action: OPEN_FFA_ARENAS
      profile:
        slot: 16
        material: PLAYER_HEAD
        name: "<gold>%player%</gold>"
        lore:
          - "<gray>Elo: <white>%elo%</white>"
          - "<gray>Rank: <white>%rank%</white>"
          - "<gray>Wins: <white>%wins%</white> <dark_gray>|</dark_gray> Losses: <white>%losses%</white>"
        action: OPEN_STATS
  management:
    title: "<gold>Z-FFA Management</gold>"
    size: 27
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: " "
  kit-editor:
    title: "<aqua>Kit Editor</aqua>"
    size: 36
    center-items: true
    filler:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
      name: " "
  kit-selector:
    title: "<gradient:#21d4fd:#b721ff><bold>Ranked Kits</bold></gradient>"
    size: 36
    center-items: true
    item-slots: [10, 11, 12, 13, 14, 15, 16, 20, 21, 22, 23, 24]
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    kit-item:
      name: "%kit_display%"
      lore:
        - "<gray>Queued: <white>%queue_size%</white>"
        - "<gray>Click to join ranked."
        - "<dark_gray>Combat kit: no blocks or TNT."
        - "<dark_gray>Permission: zf.kit.%kit%"
      glow: false
  kit-selector-unranked:
    title: "<gradient:#a8ff78:#78ffd6><bold>Unranked Kits</bold></gradient>"
    size: 36
    center-items: true
    item-slots: [10, 11, 12, 13, 14, 15, 16, 20, 21, 22, 23, 24]
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    kit-item:
      name: "%kit_display%"
      lore:
        - "<gray>Queued: <white>%queue_size%</white>"
        - "<gray>Click to join unranked."
        - "<dark_gray>Combat kit: no blocks or TNT."
        - "<dark_gray>Permission: zf.kit.%kit%"
      glow: false
  ffa-arenas:
    title: "<green><bold>FFA Arenas</bold></green>"
    size: 27
    center-items: true
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    arena-item:
      material: NETHERITE_SWORD
      name: "<green>%arena%</green>"
      lore:
        - "%arena_status%"
        - "<gray>Players: <white>%arena_players%</white>"
        - "<gray>Default kit: <white>%default_kit%</white>"
        - "<gray>VIP: <white>%arena_vip%</white>"
        - "<gray>Click to join FFA combat."
      glow: false
  stats:
    title: "<aqua>Your Stats</aqua>"
    size: 27
    items:
      profile:
        slot: 13
        material: PLAYER_HEAD
        name: "<gold>%player%</gold>"
        lore:
          - "<gray>Elo: <white>%elo%</white>"
          - "<gray>Rank: <white>%rank%</white>"
          - "<gray>Wins: <white>%wins%</white>"
          - "<gray>Losses: <white>%losses%</white>"
          - "<gray>Kills: <white>%kills%</white>"
          - "<gray>Deaths: <white>%deaths%</white>"
  leaderboard:
    title: "<gold>Top Fighters</gold>"
    size: 27
    entry-item:
      material: EMERALD
      name: "<green>#%position% %player%</green>"
      lore:
        - "<gray>Elo: <white>%elo%</white>"
        - "<gray>Rank: <white>%rank%</white>"
        - "<gray>Wins: <white>%wins%</white>"
