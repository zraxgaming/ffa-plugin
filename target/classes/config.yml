# Z-FFA configuration
# MiniMessage formatting is supported in names, lore, prefixes, and messages.

settings:
  # General
  prefix: "<dark_gray>[</dark_gray><aqua>Z-FFA</aqua><dark_gray>]</dark_gray> "
  default-spawn: "world, 0, 64, 0, 0, 0"
  debug-enabled: false
  auto-update-configs: true

  update-check:
    enabled: true
    auto-download: true
    url: "https://api.github.com/repos/zraxgaming/ffa-plugin/releases/latest"

  # Storage
  # SQLITE is best for one backend. MYSQL is best when multiple backends share stats.
  database-type: "SQLITE"
  cache-expire-minutes: 20
  autosave-minutes: 5

  sqlite:
    wal: true
    synchronous: "NORMAL"
    busy-timeout-ms: 5000

  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "zffa"
    username: "root"
    password: ""
    pool-size: 6
    minimum-idle: 1
    connection-timeout-ms: 10000
    max-lifetime-ms: 1800000
    parameters: "useSSL=false&characterEncoding=utf8&useUnicode=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048"

  # Menus and lobby items
  lobby-items-enabled: true
  menu-refresh-seconds: 0 # Set 0 to disable dynamic open-menu refreshes.
  close-menu-on-inert-click: true
  player-menu:
    enabled: true

  # Matchmaking
  elo-start: 0
  match-countdown-seconds: 5
  match-timeout-minutes: 10

  unranked:
    enabled: true

  queue:
    ping-range:
      enabled: true
      max-difference: 80
      bypass-after-seconds: 30

  # Proxy mode
  # standalone = this server handles queues locally.
  # backend = this server reports capacity to the Velocity/Bungee coordinator.
  proxy:
    mode: "standalone"
    channel: "zffa:main"
    server-id: "ffa-1"
    report-capacity: true
    report-interval-seconds: 5
    route-queues: false

  # Optional event FFA entry.
  event:
    enabled: false
    arena: ""
    kit: ""

  # Combat and protection
  block-commands-in-match: true
  blocked-match-commands-bypass:
    - "/ffa leave"
    - "/duel leave"
    - "/msg"
    - "/r"

  protection:
    block-break: true
    block-place: true
    item-drop: true
    item-pickup: true
    prevent-outside-pvp: true

  ffa:
    require-mutual-hit: true
    fight-request-expire-seconds: 10
    kill-heal-hearts: 20.0
    refill-hunger-on-kill: true
    death-messages:
      enabled: true
      broadcast: true
      actionbar: true

commands:
  menu:
    enabled: true
    show-in-help: true
    aliases: [main, gui]
  join:
    enabled: true
    show-in-help: true
    aliases: [queue, kits, play, ranked]
  unranked:
    enabled: true
    show-in-help: true
    aliases: []
  ffa:
    enabled: true
    show-in-help: true
    aliases: [arenas, browser]
  event:
    enabled: false
    show-in-help: false
    aliases: []
  viparena:
    enabled: false
    show-in-help: false
    aliases: [vip]
  arena:
    enabled: false
    show-in-help: false
    aliases: []
  ranks:
    enabled: true
    show-in-help: true
    aliases: [rank]
  party:
    enabled: true
    show-in-help: true
    aliases: []
  kit:
    enabled: true
    show-in-help: true
    aliases: []
  leave:
    enabled: true
    show-in-help: true
    aliases: [quit]
  stats:
    enabled: true
    show-in-help: true
    aliases: []
  streak:
    enabled: true
    show-in-help: true
    aliases: [streaks, winstreak]
  top:
    enabled: true
    show-in-help: true
    aliases: [leaderboard]
  items:
    enabled: true
    show-in-help: false
    aliases: []
  spawn:
    enabled: true
    show-in-help: true
    aliases: [lobby]
  status:
    enabled: true
    show-in-help: true
    aliases: []

ranks:
  - name: "Coal I"
    min-elo: 0
    material: COAL
  - name: "Coal II"
    min-elo: 500
    material: COAL
  - name: "Coal III"
    min-elo: 1000
    material: COAL
  - name: "Iron"
    min-elo: 1500
    material: IRON_INGOT
  - name: "Gold"
    min-elo: 2000
    material: GOLD_INGOT
  - name: "Diamond"
    min-elo: 2500
    material: DIAMOND
  - name: "Netherite"
    min-elo: 3000
    material: NETHERITE_INGOT

lobby-items:
  queue-selector:
    slot: 0
    material: DIAMOND_SWORD
    name: "<aqua><bold>Ranked Queue</bold></aqua>"
    lore:
      - "<gray>Choose a kit and queue competitive 1v1."
      - "<dark_gray>Status: <white>%status%</white>"
    action: OPEN_KITS
  unranked-queue:
    slot: 1
    material: IRON_SWORD
    name: "<green><bold>Unranked Queue</bold></green>"
    lore:
      - "<gray>Choose a kit and queue casual 1v1."
      - "<dark_gray>Status: <white>%status%</white>"
    action: OPEN_UNRANKED_KITS
  party:
    slot: 3
    material: NAME_TAG
    name: "<light_purple>Party Hub</light_purple>"
    lore:
      - "<gray>Queue and fight with your party."
    action: OPEN_PARTY
  stats:
    slot: 4
    material: PLAYER_HEAD
    name: "<gold>Your Stats</gold>"
    lore:
      - "<gray>Elo: <white>%elo%</white> <dark_gray>|</dark_gray> <gray>Rank: <white>%rank%</white>"
      - "<gray>W/L: <white>%wins%</white><dark_gray>/</dark_gray><white>%losses%</white>"
      - "<gray>K/D: <white>%kills%</white><dark_gray>/</dark_gray><white>%deaths%</white>"
      - "<gray>Streak: <white>%streak%</white>"
    action: OPEN_STATS
  event:
    slot: 7
    material: FIREWORK_ROCKET
    name: "<yellow>Event Queue</yellow>"
    lore:
      - "<gray>Join the configured event arena."
    action: OPEN_EVENT
  leaderboard:
    slot: 8
    material: EMERALD
    name: "<green>Leaderboard</green>"
    lore:
      - "<gray>View the top cached fighters."
    action: OPEN_LEADERBOARD
